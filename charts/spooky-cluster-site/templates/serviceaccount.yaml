{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spooky-cluster-site.serviceAccountName" . }}
  labels:
    {{- include "spooky-cluster-site.labels" . | nindent 4 }}
# Belt and braces: the pod spec also refuses the token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
