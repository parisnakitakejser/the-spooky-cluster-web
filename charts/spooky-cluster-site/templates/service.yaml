apiVersion: v1
kind: Service
metadata:
  name: {{ include "spooky-cluster-site.fullname" . }}
  labels:
    {{- include "spooky-cluster-site.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "spooky-cluster-site.selectorLabels" . | nindent 4 }}
